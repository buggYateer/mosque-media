<!doctype html>

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="دروس وخطب وتلاوات مسجد النور — استمع من الموقع مباشرة">
<meta name="theme-color" content="#0b5c55">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسجد النور">
<meta property="og:type" content="website">
<meta property="og:site_name" content="مسجد النور">
<meta property="og:title" content="مسجد النور">
<meta property="og:description" content="دروس وخطب وتلاوات مسجد النور — استمع من الموقع مباشرة">
<meta property="og:url" content="https://masjed-alnoor.vercel.app/">
<meta property="og:image" content="https://masjed-alnoor.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=add_to_home_screen,auto_stories,bedtime,calendar_month,chat,check,close,dark_mode,download,forward_10,graphic_eq,groups,home,keyboard_arrow_down,library_music,light_mode,link,menu_book,mic,nights_stay,pause,person,play_arrow,replay_10,schedule,search,send,share,skip_next,skip_previous,swap_vert,trending_up,tune,wb_twilight&display=block" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="2.2" rx="1.1"/><rect x="8" y="10.9" width="13" height="2.2" rx="1.1"/><rect x="3" y="16.3" width="18" height="2.2" rx="1.1"/></svg>
  </button>
  <a class="brand" href="/" target="_self" title="تحديث الموقع"><img src="/logo-mark.svg" alt=""><span>مسجد النور</span></a>
  <nav class="nav" aria-label="الأقسام">
    <a href="/">الرئيسية</a>
    <a href="/weekly">دروس الأسبوع</a>
    <a href="/series">السلاسل</a>
    <a href="/khutab">خطب الجمعة</a>
    <a href="/all">جميع التسجيلات</a>
  </nav>
  <button class="theme-btn" id="themeBtn" aria-label="الوضع الليلي"><span class="ms" id="themeIcon">dark_mode</span></button>
  <button class="search-btn" id="searchBtn" aria-label="بحث" aria-expanded="false" aria-controls="searchbar"><span class="ms">search</span></button>
  <a class="tg-btn" href="https://t.me/your_channel" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg>
    <span>قناة التليجرام</span>
  </a>
</div>
  <div class="searchbar" id="searchbar" hidden><div class="wrap"><div class="sbox"><span class="ms" aria-hidden="true">search</span><input id="gq" type="search" placeholder="ابحث باسم الدرس أو الشيخ أو السورة" aria-label="بحث" autocomplete="off" enterkeyhint="search"></div></div></div>
</header>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="القائمة" hidden>
  <div class="drawer-h"><input class="search" id="drawerSearch" type="search" placeholder="ابحث عن درس أو شيخ" aria-label="بحث" autocomplete="off"><button class="x-btn" id="menuClose" aria-label="إغلاق القائمة"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button></div>
  <nav id="drawerNav"></nav>
</aside>

<main id="app" class="wrap" aria-live="polite"><p class="loading">جاري التحميل…</p></main>

<div class="player" id="player" hidden>
  <div class="pl-inner">
    <div class="pl-top"><button class="pl-min" id="plMin" hidden aria-label="تصغير المشغل"><span class="ms">keyboard_arrow_down</span></button><span>يُستمع الآن</span></div>
    <div class="pl-now">
      <div class="pl-art" id="plArt" aria-hidden="true"><img src="/logo-mark.svg" alt=""></div>
      <div class="pl-info"><div class="pl-title" id="plTitle"></div><div class="pl-sub" id="plSub"></div></div>
      <div class="pl-side">
        <div class="speed">
          <button class="pl-speed" id="plSpeed" aria-haspopup="menu" aria-expanded="false" aria-label="سرعة التشغيل">1×</button>
          <div class="speed-menu" id="speedMenu" role="menu" hidden></div>
        </div>
        <button class="pl-tg pl-share" id="plShare" data-share="/" aria-label="مشاركة"><span class="ms">share</span></button>
        <a class="pl-tg pl-dl" id="plDl" href="#" title="تحميل" aria-label="تحميل المقطع"><span class="ms">download</span></a>
        <a class="pl-tg" id="plTg" target="_blank" rel="noopener" aria-label="افتح في تليجرام" title="افتح في تليجرام"><svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg></a>
        <button class="pl-close" id="plClose" aria-label="إيقاف وقفل المشغل"><span class="ms">close</span></button>
      </div>
    </div>
    <div class="pl-center" dir="ltr">
      <div class="pl-seekrow">
        <span id="plTime">0:00</span>
        <input type="range" id="plSeek" min="0" max="1000" value="0" aria-label="التقدم في الدرس">
        <span id="plDur">0:00</span>
      </div>
      <div class="pl-ctrls">
        <a class="pl-btn pl-edge" id="plTg2" target="_blank" rel="noopener" aria-label="افتح في تليجرام"><svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg></a>
        <button class="pl-btn" id="plPrev" aria-label="الدرس السابق"><span class="ms">skip_previous</span></button>
        <button class="pl-btn" id="plBack" aria-label="رجوع 10 ثواني"><span class="ms">replay_10</span></button>
        <button class="pl-btn pl-main" id="plPlay" aria-label="تشغيل"><span class="ms" id="plIcon">play_arrow</span></button>
        <button class="pl-btn" id="plFwd" aria-label="تقديم 10 ثواني"><span class="ms">forward_10</span></button>
        <button class="pl-btn" id="plNext" aria-label="الدرس التالي"><span class="ms">skip_next</span></button>
        <button class="pl-btn pl-edge" id="plShare2" data-share="/" aria-label="مشاركة"><span class="ms">share</span></button>
      </div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script src="/site.js"></script>
<script src="/app.js"></script>
</body>
</html>
