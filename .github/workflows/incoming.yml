name: Move new audio to the audio store
# The dashboard stages new audio in one of two ways:
#   incoming/<id>.json  → {"url": "<Vercel Blob URL>"}  (v2 dashboard: uploaded from the browser to Vercel Blob)
#   incoming/<id>.mp3   → the file itself              (v1 dashboard)
# Here each file is uploaded (GitHub Release audio-<id/500>, or the S3 bucket) and removed from the repository.
on:
  push:
    branches: [main]
    paths: ["incoming/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: incoming, cancel-in-progress: false }
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload files to the audio store
        env:
          GH_TOKEN: ${{ github.token }}
          # Only for storage.audio.provider = "s3" (Cloudflare R2, Backblaze B2, AWS …): add these as repository secrets.
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          shopt -s nullglob
          provider=$(jq -r '.storage.audio.provider // "github-releases"' site.config.json)
          moved=0
          mkdir -p /tmp/audio
          for f in incoming/*.json incoming/*.mp3; do
            id=$(basename "$f"); id=${id%.*}
            case "$id" in (*[!0-9_]*|'') echo "Bad name: $f"; continue;; esac
            if [ "${f##*.}" = "json" ]; then
              url=$(jq -r .url "$f")
              case "$url" in (https://*.public.blob.vercel-storage.com/*) ;; (*) echo "Bad URL in $f"; continue;; esac
              curl -fsSL "$url" -o "/tmp/audio/$id.mp3" || { echo "Download failed: $f"; continue; }
              src="/tmp/audio/$id.mp3"
            else
              src="$f"
            fi
            if [ "$provider" = "s3" ]; then
              aws s3 cp "$src" "s3://$S3_BUCKET/$id.mp3" --endpoint-url "$S3_ENDPOINT" --content-type audio/mpeg
            else
              num=${id%%_*}
              tag="audio-$((num / 500))"
              gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Audio $tag" --notes "Audio files of the site"
              gh release upload "$tag" "$src" --clobber
            fi
            git rm -q "$f"
            moved=$((moved + 1))
          done
          if [ "$moved" -gt 0 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -qm "Move $moved audio file(s) to Releases"
            git push
          fi
